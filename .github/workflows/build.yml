name: umi-full-nova

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "SukiSU 引用（builtin=非GKI手动hook树）"
        required: true
        default: "builtin"
      hook_mode:
        description: "auto=自动适配hook；manual=不动；off=停用全部手动hook"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "manual", "off"]
      susfs_mode:
        description: "SUSFS：off=先关掉保证能编过；on=内核树SUSFS版本够新才用"
        required: true
        default: "off"
        type: choice
        options: ["off", "on"]
      kpm_mode:
        description: "KPM：on/off"
        required: true
        default: "on"
        type: choice
        options: ["on", "off"]
      kpm_patch:
        description: "KPM patch_linux 版本"
        required: true
        default: "0.12.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      KSU_REF: ${{ github.event.inputs.ksu_ref }}
      HOOK_MODE: ${{ github.event.inputs.hook_mode }}
      KSU_SUSFS_MODE: ${{ github.event.inputs.susfs_mode }}
      KSU_KPM_MODE: ${{ github.event.inputs.kpm_mode }}
      KPM_PATCH: ${{ github.event.inputs.kpm_patch }}
    steps:
      - name: 1. 拉内核源
        uses: actions/checkout@v4
        with:
          repository: liyafe1997/kernel_xiaomi_sm8250_mod
          ref: android15-lineage22-mod
          path: kernel
          fetch-depth: 1

      - name: 2. 腾磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/lib/jvm /opt/az
          sudo apt-get clean
          df -h /

      - name: 3. 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip unzip bc cpio libssl-dev ccache python-is-python3 python3 libelf-dev device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lz4 zstd xz-utils rsync kmod file

      - name: 4. 缓存工具链
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/proton-clang
          key: proton-clang-20210522-v1

      - name: 5. 下载 proton-clang
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/proton-clang" && cd "$HOME/proton-clang"
          for i in 1 2 3 4 5 6; do
            wget -q --tries=3 --retry-connrefused --waitretry=8 https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip && break
            echo "[retry $i]"; sleep 15
          done
          unzip -q 20210522.zip
          test -x proton-clang-20210522/bin/clang

      - name: 6. 关掉 build.sh 自带的 KSU setup（避免它 git stash 掉我们的补丁）
        working-directory: kernel
        run: |
          set -e
          sed -i 's#^\( *\)curl -LSs .*setup\.sh.*#\1echo "[i] KSU 已在步骤 7 预装，跳过 build.sh 内重复 setup"#' build.sh
          sed -i "s#SukiSU_KernelPatch_patch/releases/download/0.12.0/#SukiSU_KernelPatch_patch/releases/download/${KPM_PATCH}/#" build.sh
          grep -n "setup\|KernelPatch\|KSU is" build.sh

      - name: 7. 预装 Nova KSU（builtin）
        working-directory: kernel
        run: |
          set -e
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Nova/SukiSU-Nova/main/kernel/setup.sh" | bash -s "${KSU_REF}"
          cd KernelSU
          git log -1 --format='KSU 提交: %h %ad %s' --date=short
          CNT=$(git rev-list --count main 2>/dev/null || echo 0)
          echo "预测 KSU_VERSION = $((30000 + CNT - 4001))"

      - name: 8. 自动适配 hook（改名 / 停用缺失符号）
        if: env.HOOK_MODE != 'manual'
        working-directory: kernel
        run: |
          set -e
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c; do
            sed -i 's/ksu_handle_execveat(/ksu_handle_execveat_ksud(/g' "$f"
            missing=""
            for sym in $(grep -hoE 'ksu_[a-z0-9_]+' "$f" | sort -u); do
              if ! grep -rq -F "$sym" KernelSU/kernel; then
                missing="$missing $sym"
              fi
            done
            if [ -n "$missing" ] || [ "$HOOK_MODE" = "off" ]; then
              echo "$f: 停用 hook 块 (${missing})"
              sed -i 's|^[[:space:]]*#ifdef CONFIG_KSU[[:space:]]*$|#if 0|' "$f"
              sed -i 's|^[[:space:]]*#if defined(CONFIG_KSU)[[:space:]]*$|#if 0|' "$f"
            else
              echo "$f: 保留（符号齐全）"
            fi
          done
          grep -n '^#if 0' fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c || echo "无停用"

      - name: 8b. 造 4.19 缺失头文件（static_call.h）
        working-directory: kernel
        run: |
          set -e
          if [ ! -f include/linux/static_call.h ]; then
            {
              echo '/* 4.19 shim: Nova 只是 include 这个头，没有实际使用 static_call API */'
              echo '#ifndef _KSU_STATIC_CALL_SHIM_H'
              echo '#define _KSU_STATIC_CALL_SHIM_H'
              echo '#endif'
            } > include/linux/static_call.h
            echo "[i] 已创建 include/linux/static_call.h"
          fi
          sed -n '1,6p' include/linux/static_call.h

      - name: 8c. 生成附加配置脚本并挂到 build.sh
        working-directory: kernel
        run: |
          set -e
          {
            echo '#!/bin/sh'
            echo 'set -e'
            echo 'if [ "$KSU_SUSFS_MODE" = "off" ]; then'
            echo '  scripts/config --file out/.config -d KSU_SUSFS || true'
            echo '  for s in KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_PRIORITY_UID_FILTER; do'
            echo '    scripts/config --file out/.config -d "$s" || true'
            echo '  done'
            echo 'fi'
            echo 'if [ "$KSU_KPM_MODE" = "off" ]; then'
            echo '  scripts/config --file out/.config -d KPM || true'
            echo 'fi'
            echo 'echo "[i] extra config: SUSFS=$KSU_SUSFS_MODE KPM=$KSU_KPM_MODE"'
          } > ksu_extra_config.sh
          chmod +x ksu_extra_config.sh
          sed -i 's|^make \$MAKE_ARGS -j\$(nproc)$|sh ksu_extra_config.sh\nmake $MAKE_ARGS -j$(nproc)|' build.sh
          grep -n "ksu_extra_config" build.sh
          echo "===== ksu_extra_config.sh ====="
          cat ksu_extra_config.sh

      - name: 9. 全量编译（AOSP + MIUI 两遍）
        working-directory: kernel
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache_mikernel"
          ccache -M 4G || true
          bash build.sh umi ksu 2>&1 | tee ../build.log

      - name: 10. 产物自检
        working-directory: kernel
        run: |
          ls -lh Kernel_*.zip
          grep -m3 "SukiSU-Nova version:" ../build.log || true
          grep -E "AOSP Build successfully|MIUI Build successfully" ../build.log || true
          for z in Kernel_*.zip; do
            unzip -p "$z" kernels/Image > /tmp/img.bin
            echo "--- $z"
            echo "  size : $(stat -c%s /tmp/img.bin)"
            echo "  ver  : $(strings /tmp/img.bin | grep -m1 'Linux version')"
            echo "  ksu  : $(strings /tmp/img.bin | grep -m1 'SukiSU-Nova' || true)"
          done

      - name: 11. 收集产物
        if: always()
        working-directory: kernel
        run: |
          mkdir -p ../artifacts/modules
          cp Kernel_*.zip ../artifacts/ 2>/dev/null || true
          find out -name '*.ko' -print0 2>/dev/null | xargs -0 -r cp --parents -t ../artifacts/modules/ 2>/dev/null || true
          cp ../build.log ../artifacts/ 2>/dev/null || true

      - name: 12. 失败时捞错误
        if: failure()
        run: |
          echo "===== 编译错误 ====="
          grep -nE "error:|Error [0-9]+|undefined reference|implicit declaration|No such file|fatal error" build.log | tail -40 || echo "无典型错误行"
          echo "===== KSU 相关 ====="
          grep -nE "KernelSU|kernelsu|ksu_|SukiSU-Nova|SUSFS" build.log | tail -30 || true
          echo "===== 尾部 ====="
          tail -30 build.log || true

      - name: 13. 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umi-nova-${{ github.run_id }}-${{ env.KSU_REF }}-${{ env.KSU_SUSFS_MODE }}
          path: artifacts
          retention-days: 30
